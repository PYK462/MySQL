erDiagram
    Users {
        VARCHAR(20) UserID PK "用户唯一标识"
        VARCHAR(50) UserName "非空"
        VARCHAR(50) Password "非空"
        VARCHAR(20) Phone
        VARCHAR(100) Email
        VARCHAR(20) StudentID
        VARCHAR(255) Avatar
        INT Role "默认0 | 0:普通用户,1:管理员"
        DATETIME RegTime "默认CURRENT_TIMESTAMP"
    }
    Categories {
        INT CategoryID PK "自增 | 分类唯一标识"
        VARCHAR(50) CategoryName "非空"
    }
    Items {
        INT ItemID PK "自增 | 物品唯一标识"
        VARCHAR(100) ItemName "非空"
        TEXT Description
        DECIMAL(10,2) Price "非空"
        DECIMAL(10,2) OriginalPrice
        VARCHAR(50) UsageStatus
        VARCHAR(255) Image
        INT Status "默认1 | 1:在售,0:已售,-1:下架"
        VARCHAR(20) SellerID FK "引用Users.UserID"
        INT CategoryID FK "引用Categories.CategoryID"
        DATETIME PublishTime "默认CURRENT_TIMESTAMP"
    }
    Orders {
        VARCHAR(50) OrderID PK "订单唯一标识"
        INT ItemID FK "非空 | 引用Items.ItemID"
        VARCHAR(20) BuyerID FK "非空 | 引用Users.UserID"
        VARCHAR(20) SellerID FK "非空 | 引用Users.UserID"
        DECIMAL(10,2) TotalAmount "非空"
        INT OrderStatus "默认0 | 0:待付款,1:已付款,2:待发货,3:已发货,4:已完成,5:已取消"
        DATETIME OrderTime "默认CURRENT_TIMESTAMP"
        DATETIME PaymentTime
        DATETIME ShippingTime
        DATETIME CompletionTime
    }
    Comments {
        INT CommentID PK "自增 | 留言唯一标识"
        INT ItemID FK "非空 | 引用Items.ItemID"
        VARCHAR(20) UserID FK "非空 | 引用Users.UserID"
        TEXT Content "非空"
        INT ParentID FK "默认0 | 引用Comments.CommentID | 0:主留言"
        DATETIME CommentTime "默认CURRENT_TIMESTAMP"
    }
    %% 实体关系定义
    Users ||--o{ Items : "发布（卖家）"
    Categories ||--o{ Items : "包含"
    Users ||--o{ Orders : "购买（买家）"
    Users ||--o{ Orders : "出售（卖家）"
    Items ||--o{ Orders : "被购买"
    Items ||--o{ Comments : "拥有"
    Users ||--o{ Comments : "发表"
    Comments ||--o{ Comments : "回复"